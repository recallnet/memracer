<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta
      name="description"
      content="memracer — turn intent into shipped PRs with Frigg and an autonomous agent fleet. Join the waitlist."
    />
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem("memracer.react.theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
          else document.documentElement.removeAttribute("data-theme");
        } catch {
          document.documentElement.removeAttribute("data-theme");
        }
      })();
    </script>
    <title>memracer — autonomous coding fleet</title>
    <link rel="icon" type="image/png" href="/dashboard/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/dashboard/icons/apple-touch-icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/marketing.tsx"></script>
  </body>
</html>
