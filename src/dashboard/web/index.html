<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="memracer" />
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem("memracer.react.theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
          else document.documentElement.removeAttribute("data-theme");
        } catch {
          document.documentElement.removeAttribute("data-theme");
        }
      })();
    </script>
    <title>memracer</title>
    <link rel="manifest" href="/dashboard/manifest.json" />
    <link rel="apple-touch-icon" href="/dashboard/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="/dashboard/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
